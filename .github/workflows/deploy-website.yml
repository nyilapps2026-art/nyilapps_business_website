name: Deploy NYIL Business Website
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate website source
        run: |
          test -s website/index.html
          test -s website/styles.css
          test -s website/app.js
          node --check website/app.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Deploy public website to Cloudflare Pages
        run: npx wrangler@latest pages deploy website --project-name=nyil-business-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9a18ad290071836e90efd88b75c5d541
