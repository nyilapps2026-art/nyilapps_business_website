name: Build NYIL Admin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/build-admin.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Admin
        run: npm run build
      - name: Verify production output
        run: test -s dist/index.html
      - name: Deploy Admin to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name=nyil-admin --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9a18ad290071836e90efd88b75c5d541
      - name: Upload production files
        uses: actions/upload-artifact@v5
        with:
          name: nyil-admin-dist
          path: admin/dist/
          if-no-files-found: error
          retention-days: 7
